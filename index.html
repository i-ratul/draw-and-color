<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Portrait phone, no pinch-zoom, fill the notch area -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ECE9E4" />
  <title>Draw &amp; Colour</title>

  <style>
    /* ---------- global reset ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;                 /* never scroll the page */
      background: #FFFFFF;              /* page background is white */
      overscroll-behavior: none;        /* no rubber-band scroll */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;       /* canvas itself overrides to none */
      font-family: sans-serif;          /* only used for emoji placeholders in step 1 */
    }

    /* ===========================================================
       APP LAYOUT  (top toolbar + bottom canvas), filling viewport
       =========================================================== */
    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* ---------- TOOLBAR (finger-only control strip) ---------- */
    #toolbar {
      flex: 0 0 auto;                   /* height grows to fit the three blocks */
      background: #ECE9E4;              /* warm grey: visibly different from white canvas */
      border-bottom: 2px solid #d2cdc4; /* subtle boundary line */
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);  /* subtle shadow reinforces the boundary */
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      z-index: 10;
    }

    /* each toolbar GROUP is its own tray, so the three blocks read as
       distinct zones: tools / colours / actions(undo+arrows+pictures) */
    .block {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F4F1EC;              /* lighter tray surface inside the toolbar */
      border: 1px solid #ddd6cb;
      border-radius: 16px;
      padding: 6px 10px;
    }
    .tools-block   { justify-content: center; }
    .colours-block { justify-content: center; }
    .actions-block { justify-content: space-around; }

    /* ---------- generic button look (placeholders for now) ---------- */
    .btn {
      flex: 0 0 auto;
      min-width: 64px;                  /* MIN_BUTTON_PX */
      height: 100%;
      max-height: 64px;
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 14px;
      background: #F7F5F2;
      box-shadow: inset 0 0 0 1px #ddd6cb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;                  /* emoji placeholder size */
      color: #5a544b;
      cursor: pointer;
    }

    /* colour swatches in row 2 */
    .swatch {
      flex: 0 0 auto;
      min-width: 64px;
      height: 100%;
      max-height: 64px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 1px #c9c2b6;
      cursor: pointer;
    }

    /* the "more colours" opener: a small rainbow swatch */
    .palette-swatch {
      background: conic-gradient(#E23B2E, #F2C53D, #3DA35D, #2E6BE2, #8e5bd6, #E23B2E);
    }

    /* ---------- CANVAS AREA (pen-only drawing zone) ---------- */
    #canvas-area {
      flex: 1 1 auto;                   /* the remaining ~86% */
      position: relative;
      background: #FFFFFF;
      overflow: hidden;
    }

    /* two stacked canvases fill the pen-only area, exactly on top of
       each other. Bottom = artLayer (outline), top = drawLayer (strokes). */
    #art-layer, #draw-layer {
      position: absolute;
      inset: 0;
      display: block;
    }
    #art-layer  {
      z-index: 1;
      pointer-events: none;            /* never receives input — can't be drawn on */
    }
    #draw-layer {
      z-index: 2;
      touch-action: none;              /* no scroll/zoom gestures on the canvas */
    }

    /* ---------- page-navigation arrows (now live in the toolbar) ---------- */
    .arrow {
      flex: 0 0 auto;
      min-width: 64px;
      height: 100%;
      max-height: 64px;
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 50%;
      background: rgba(120, 114, 104, 0.32);   /* soft grey: reads as "navigation" */
      color: #ffffff;
      font-size: 28px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* dimmed + inert state (e.g. left arrow on page 1) */
    .arrow.disabled {
      opacity: 0.25;
      pointer-events: none;
    }

    /* ===========================================================
       START SCREEN  (calm cover; first tap → fullscreen + reveal)
       =========================================================== */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #ECE9E4;              /* same calm warm grey as the toolbar */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* one large central button, no text — just an icon */
    #start-btn {
      width: 40vw;
      height: 40vw;
      max-width: 260px;
      max-height: 260px;
      min-width: 160px;
      min-height: 160px;
      border: none;
      border-radius: 50%;
      background: #F7F5F2;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15), inset 0 0 0 2px #ddd6cb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 96px;                  /* emoji placeholder; real icon at polish step */
      cursor: pointer;
    }
    /* a gentle press feedback (the only animation — calm, not bouncy) */
    #start-btn:active { background: #efece6; }

    /* hide the app behind the start screen until the first tap */
    #app.hidden { visibility: hidden; }

    /* ---------- selected-tool state (calm, no bounce) ---------- */
    .btn.selected {
      background: #e3ddd1;
      box-shadow: inset 0 0 0 3px #b3a991;
    }
    /* dimmed action button when it has nothing to do (e.g. empty undo) */
    .btn.dim { opacity: 0.3; pointer-events: none; }

    /* ---------- icons (SVG, no text) ---------- */
    .btn svg   { width: 32px; height: 32px; color: #5a544b; pointer-events: none; }
    .arrow svg { width: 30px; height: 30px; color: #ffffff; pointer-events: none; }

    /* ---------- selected colour ring ---------- */
    .swatch.selected {
      box-shadow: 0 0 0 4px #4a4640;
    }

    /* ===========================================================
       POPUPS  (palette + pictures) — finger-operated, dimmed back
       =========================================================== */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .backdrop[hidden] { display: none; }

    .panel {
      background: #F4F1EC;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
      display: grid;
      gap: 14px;
      max-width: 92vw;
    }

    /* palette: grid of large colour squares */
    #palette-grid { grid-template-columns: repeat(4, 1fr); }
    .palette-cell {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 1px #c9c2b6;
      cursor: pointer;
    }

    /* pictures: grid of thumbnails (white tiles) */
    #pictures-grid { grid-template-columns: repeat(2, 1fr); }
    .picture-cell {
      width: 38vw;
      max-width: 150px;
      height: 38vw;
      max-height: 150px;
      background: #ffffff;
      border: 1px solid #c9c2b6;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }
    .picture-cell img {
      max-width: 86%;
      max-height: 86%;
    }
    /* the "blank page" tile is just an empty white square */
    .picture-cell.blank { background: #ffffff; }
  </style>
</head>

<body>
  <!-- ============ START SCREEN (first tap → fullscreen) ============ -->
  <div id="start-screen">
    <button id="start-btn" title="" aria-label="start">✏️</button>
  </div>

  <div id="app" class="hidden">

    <!-- ============ TOOLBAR (three distinct blocks) ============ -->
    <div id="toolbar">

      <!-- Block 1: drawing tools, plus the black swatch (moved here so the
           colours row fits on screen without shrinking anything). -->
      <div class="block tools-block">
        <button class="btn selected" data-tool="pen"         aria-label="pen">✏️</button>
        <button class="btn"          data-tool="brush"       aria-label="brush">🖌️</button>
        <button class="btn"          data-tool="highlighter" aria-label="highlighter">🖍️</button>
        <button class="btn"          data-tool="eraser"      aria-label="eraser">🧽</button>
        <button class="swatch selected" style="background:#000000" data-colour="#000000"
                aria-label="black"></button>
      </div>

      <!-- Block 2: colours + palette opener -->
      <div class="block colours-block">
        <button class="swatch" style="background:#E23B2E" data-colour="#E23B2E" aria-label="red"></button>
        <button class="swatch" style="background:#2E6BE2" data-colour="#2E6BE2" aria-label="blue"></button>
        <button class="swatch" style="background:#F2C53D" data-colour="#F2C53D" aria-label="yellow"></button>
        <button class="swatch" style="background:#3DA35D" data-colour="#3DA35D" aria-label="green"></button>
        <button class="swatch palette-swatch" id="btn-palette" aria-label="more colours"></button>
      </div>

      <!-- Block 3: undo, page arrows, pictures -->
      <div class="block actions-block">
        <button class="btn dim" id="btn-undo"      aria-label="undo">↩️</button>
        <button class="arrow disabled" id="arrow-left"  aria-label="previous page">◀</button>
        <button class="arrow"          id="arrow-right" aria-label="next page">▶</button>
        <button class="btn"     id="btn-pictures"  aria-label="pictures">🖼️</button>
      </div>

    </div>

    <!-- ============ CANVAS AREA (pen-only, nothing overlaid) ============ -->
    <div id="canvas-area">
      <canvas id="art-layer"></canvas>
      <canvas id="draw-layer"></canvas>
    </div>

  </div>

  <!-- ============ PALETTE POPUP ============ -->
  <div class="backdrop" id="palette-popup" hidden>
    <div class="panel"><div id="palette-grid"></div></div>
  </div>

  <!-- ============ PICTURES POPUP ============ -->
  <div class="backdrop" id="pictures-popup" hidden>
    <div class="panel"><div id="pictures-grid"></div></div>
  </div>

  <script>
    /* =========================================================
       CONFIG — all tunable constants live here (Section 12)
       ========================================================= */
    const CONFIG = {
      TOOLBAR_HEIGHT_PCT: 14,
      PEN_WIDTH:    4,
      BRUSH_WIDTH:  10,    // was 22 → 14 → 10, reduced after device tests
      HILITE_WIDTH: 18,    // was 28 — reduced ~35% after device test
      HILITE_ALPHA: 0.35,
      ERASER_WIDTH: 40,
      FIXED_COLOURS:   ['#000000','#E23B2E','#2E6BE2','#F2C53D','#3DA35D'],
      PALETTE_COLOURS: [    // 12 calm colours for the popup (4 × 3 grid)
        '#000000','#6E6E6E','#E23B2E','#F2914B',
        '#F2C53D','#3DA35D','#2E9E9E','#2E6BE2',
        '#6A5ACD','#B05BD6','#D65B9A','#8B5A2B'
      ],
      PAGE_COUNT:     10,
      PICTURES_SHOWN: 5,     // random pictures shown; a blank tile is added as the 1st (6 tiles total)
      UNDO_DEPTH:     3,
      MIN_BUTTON_PX:  64,
      MIN_ARROW_PX:   72,
      TOOLBAR_BG: '#ECE9E4',
      PAGE_BG:    '#FFFFFF'
    };

    /* FALLBACK list of line-art in /art/. Normally the app auto-discovers
       whatever PNGs are in the /art/ folder (see refreshArtList below); this
       hard-coded list is only used if that discovery fails (offline, not on
       GitHub Pages, API hiccup). Just drop transparent PNGs into /art/ — they
       get picked up automatically; you don't need to edit this list. */
    const ART_FILES = ['star.png','heart.png','balloon.png','house.png',
                       'flower.png','fish.png','sun.png','car.png'];
    let availableArt = ART_FILES.slice();   // updated at startup by refreshArtList()

    /* Auto-discover the PNGs sitting in the /art/ folder on GitHub Pages by
       asking the GitHub API to list the folder. Owner/repo are read from the
       page URL so nothing is hard-coded. Images themselves are still loaded
       from the same-origin /art/ path, so the canvas never gets "tainted". */
    async function refreshArtList() {
      try {
        const host = location.hostname;               // e.g. i-ratul.github.io
        if (!host.endsWith('github.io')) return;      // discovery only works there
        const owner = host.split('.')[0];
        const repo  = location.pathname.split('/').filter(Boolean)[0];
        if (!owner || !repo) return;
        const res = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/art');
        if (!res.ok) return;
        const items = await res.json();
        const pngs = items
          .filter(it => it.type === 'file' && /\.png$/i.test(it.name))
          .map(it => it.name);
        if (pngs.length) availableArt = pngs;
      } catch (_) { /* keep the bundled fallback list */ }
    }
    refreshArtList();

    /* =========================================================
       STEP 2 — Start screen → fullscreen → reveal app
       ========================================================= */
    const startScreen = document.getElementById('start-screen');
    const startBtn    = document.getElementById('start-btn');
    const appEl       = document.getElementById('app');

    /* =========================================================
       STEP 3 — High-DPI drawing canvas + pen-only input
       ========================================================= */
    const canvasArea = document.getElementById('canvas-area');
    const artCanvas  = document.getElementById('art-layer');   // back: outline (uneraseable)
    const actx       = artCanvas.getContext('2d');
    const drawCanvas = document.getElementById('draw-layer');  // front: child's strokes
    const dctx       = drawCanvas.getContext('2d');

    /* offscreen buffer: holds a snapshot of the canvas taken at the start of
       a highlighter stroke, so we can redraw the whole stroke cleanly each
       frame (see the smooth-highlighter logic below). */
    const buf  = document.createElement('canvas');
    const bctx = buf.getContext('2d');

    /* Make the canvas crisp on this high-density screen:
       - CSS size = the area's layout size (in CSS pixels)
       - drawing buffer = CSS size × devicePixelRatio (the real pixels)
       - scale the context so all our drawing code stays in CSS pixels
       NOTE: setting canvas.width/height clears the canvas and resets the
       context, so we re-apply the scale and line style every time. */
    function sizeCanvas(canvas, ctx) {
      const rect = canvasArea.getBoundingClientRect();
      const cssW = Math.round(rect.width);
      const cssH = Math.round(rect.height);
      const dpr  = window.devicePixelRatio || 1;

      canvas.style.width  = cssW + 'px';
      canvas.style.height = cssH + 'px';
      canvas.width  = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);

      ctx.setTransform(1, 0, 0, 1, 0, 0);   // clear any previous scaling
      ctx.scale(dpr, dpr);                   // now 1 unit = 1 CSS pixel
      ctx.lineCap  = 'round';
      ctx.lineJoin = 'round';
      return { cssW, cssH, dpr };
    }

    /* current canvas size in CSS pixels (used for fitting pictures) */
    let CSS_W = 0, CSS_H = 0;

    /* re-apply CSS-pixel scaling + round line style to a context */
    function applyScale(ctx) {
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      ctx.lineCap  = 'round';
      ctx.lineJoin = 'round';
    }

    /* wipe a layer fully transparent */
    function clearLayer(ctx, canvas) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      applyScale(ctx);
    }

    /* REPLACE a layer's contents with a source canvas, scaled to fill the
       device pixels. Clears first, so callers get a true replace (this is what
       undo / page-restore / resize all need). */
    function blit(src, ctx, canvas) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
      applyScale(ctx);
    }

    /* take a 1:1 device-pixel snapshot of a canvas into a fresh offscreen canvas */
    function snapshot(canvas) {
      const c = document.createElement('canvas');
      c.width = canvas.width; c.height = canvas.height;
      c.getContext('2d').drawImage(canvas, 0, 0);
      return c;
    }

    function resizeCanvases() {
      if (appEl.classList.contains('hidden')) return;   // not revealed yet

      /* preserve whatever is on screen across a resize (e.g. the address bar
         re-appearing changes the height and would otherwise clear the canvas). */
      const had = drawCanvas.width > 0;
      const artSnap  = had ? snapshot(artCanvas)  : null;
      const drawSnap = had ? snapshot(drawCanvas) : null;

      const m = sizeCanvas(artCanvas,  actx);    // back layer (outline)
      sizeCanvas(drawCanvas, dctx);              // front layer (strokes)
      buf.width  = drawCanvas.width;             // match device pixels for 1:1 copies
      buf.height = drawCanvas.height;
      CSS_W = m.cssW; CSS_H = m.cssH;

      if (artSnap)  blit(artSnap,  actx, artCanvas);
      if (drawSnap) blit(drawSnap, dctx, drawCanvas);
    }

    /* =========================================================
       STEP 4 — Four tools (Pen / Brush / Highlighter / Eraser)
       ========================================================= */
    let currentTool   = 'pen';
    let currentColour = '#000000';            // colour switching arrives at Step 6

    /* set up the context for whichever tool is selected. Called on pen-down
       so the whole stroke uses one consistent style. */
    function applyToolStyle() {
      dctx.globalAlpha = 1;                   // opaque by default
      dctx.strokeStyle = currentColour;
      dctx.fillStyle   = currentColour;

      switch (currentTool) {
        case 'pen':
          dctx.globalCompositeOperation = 'source-over';
          dctx.lineWidth = CONFIG.PEN_WIDTH;
          break;
        case 'brush':
          dctx.globalCompositeOperation = 'source-over';
          dctx.lineWidth = CONFIG.BRUSH_WIDTH;
          break;
        case 'highlighter':
          dctx.globalCompositeOperation = 'source-over';
          dctx.globalAlpha = CONFIG.HILITE_ALPHA;   // see-through (simple v1 fallback)
          dctx.lineWidth = CONFIG.HILITE_WIDTH;
          break;
        case 'eraser':
          dctx.globalCompositeOperation = 'destination-out';  // clears pixels
          dctx.lineWidth = CONFIG.ERASER_WIDTH;
          break;
      }
    }

    /* tool buttons (finger-operated; plain clicks, no pen filter) */
    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTool = btn.dataset.tool;
        document.querySelectorAll('[data-tool]').forEach(b =>
          b.classList.toggle('selected', b === btn));
      });
    });

    /* ---------- pen-only drawing ---------- */
    let drawing  = false;
    let lastX = 0, lastY = 0;
    let hlActive = false;          // is the current stroke a highlighter stroke?
    let hlPoints = [];             // its points so far, in CSS pixels

    function canvasXY(e) {
      const rect = drawCanvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    /* snapshot the whole canvas into the buffer (raw device pixels, 1:1) */
    function snapshotToBuf() {
      bctx.setTransform(1, 0, 0, 1, 0, 0);
      bctx.clearRect(0, 0, buf.width, buf.height);
      bctx.drawImage(drawCanvas, 0, 0);
    }

    /* restore the canvas from that snapshot, then re-establish CSS-pixel scaling
       and the current tool's style. */
    function restoreFromBuf() {
      const dpr = window.devicePixelRatio || 1;
      dctx.setTransform(1, 0, 0, 1, 0, 0);
      dctx.globalAlpha = 1;                          // restore at FULL opacity
      dctx.globalCompositeOperation = 'source-over'; // (not the highlighter's 35%)
      dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      dctx.drawImage(buf, 0, 0);
      dctx.scale(dpr, dpr);
      applyToolStyle();                              // now set the highlighter style
    }

    /* SMOOTH HIGHLIGHTER: redraw the in-progress stroke from the pre-stroke
       snapshot as ONE shape at 35%. Because it's a single stroke() call,
       self-overlaps merge instead of stacking — no dark "beads". */
    function redrawHighlighter() {
      restoreFromBuf();
      if (hlPoints.length === 1) {
        const p = hlPoints[0];
        dctx.beginPath();
        dctx.arc(p.x, p.y, dctx.lineWidth / 2, 0, Math.PI * 2);
        dctx.fill();
        return;
      }
      dctx.beginPath();
      dctx.moveTo(hlPoints[0].x, hlPoints[0].y);
      for (let i = 1; i < hlPoints.length; i++) dctx.lineTo(hlPoints[i].x, hlPoints[i].y);
      dctx.stroke();
    }

    function penDown(e) {
      if (e.pointerType !== 'pen') return;   // PEN ONLY — this is our palm rejection
      e.preventDefault();
      drawing = true;
      try { drawCanvas.setPointerCapture(e.pointerId); } catch (_) {}

      pushUndo();                            // remember drawLayer before this stroke
      applyToolStyle();
      const { x, y } = canvasXY(e);
      lastX = x; lastY = y;

      hlActive = (currentTool === 'highlighter');
      if (hlActive) {
        hlPoints = [{ x, y }];
        snapshotToBuf();           // remember the canvas before this stroke
        redrawHighlighter();       // show the starting dot
      } else {
        /* a single tap should leave a dot, not nothing */
        dctx.beginPath();
        dctx.arc(x, y, dctx.lineWidth / 2, 0, Math.PI * 2);
        dctx.fill();
      }
    }

    function penMove(e) {
      if (!drawing || e.pointerType !== 'pen') return;
      e.preventDefault();
      const { x, y } = canvasXY(e);

      if (hlActive) {
        hlPoints.push({ x, y });
        redrawHighlighter();
      } else {
        dctx.beginPath();
        dctx.moveTo(lastX, lastY);
        dctx.lineTo(x, y);
        dctx.stroke();
      }
      lastX = x; lastY = y;
    }

    function penUp(e) {
      if (!drawing) return;
      e.preventDefault();
      drawing  = false;
      hlActive = false;
      hlPoints = [];
      try { drawCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }

    drawCanvas.addEventListener('pointerdown',   penDown, { passive: false });
    drawCanvas.addEventListener('pointermove',   penMove, { passive: false });
    drawCanvas.addEventListener('pointerup',     penUp,   { passive: false });
    drawCanvas.addEventListener('pointercancel', penUp,   { passive: false });

    /* =========================================================
       STEP 6 — Colours (five fixed swatches + black)
       ========================================================= */
    function selectColour(hex) {
      currentColour = hex;
      document.querySelectorAll('[data-colour]').forEach(b =>
        b.classList.toggle('selected', b.dataset.colour === hex));
    }
    document.querySelectorAll('[data-colour]').forEach(sw => {
      sw.addEventListener('click', () => selectColour(sw.dataset.colour));
    });

    /* =========================================================
       STEP 7 — Palette popup (12 colours, backdrop-tap to close)
       ========================================================= */
    const palettePopup = document.getElementById('palette-popup');
    const paletteGrid   = document.getElementById('palette-grid');
    CONFIG.PALETTE_COLOURS.forEach(hex => {
      const cell = document.createElement('button');
      cell.className = 'palette-cell';
      cell.style.background = hex;
      cell.addEventListener('click', () => {
        selectColour(hex);                 // fixed swatches lose their ring (fine)
        palettePopup.hidden = true;
      });
      paletteGrid.appendChild(cell);
    });
    document.getElementById('btn-palette').addEventListener('click', () => {
      palettePopup.hidden = false;
    });
    palettePopup.addEventListener('click', e => {
      if (e.target === palettePopup) palettePopup.hidden = true;   // backdrop tap
    });

    /* =========================================================
       STEP 8 — Pictures popup (blank + random line-art onto artLayer)
       ========================================================= */
    const picturesPopup = document.getElementById('pictures-popup');
    const picturesGrid  = document.getElementById('pictures-grid');

    /* draw a line-art PNG onto the artLayer, "contain"-fit and centred */
    function loadPicture(src) {
      const img = new Image();
      img.onload = () => {
        clearLayer(actx, artCanvas);       // replace any previous outline
        const scale = Math.min(CSS_W / img.naturalWidth, CSS_H / img.naturalHeight);
        const w = img.naturalWidth  * scale;
        const h = img.naturalHeight * scale;
        actx.globalAlpha = 0.5;            // pictures load at 50% opacity (lighter outline)
        actx.drawImage(img, (CSS_W - w) / 2, (CSS_H - h) / 2, w, h);
        actx.globalAlpha = 1;
      };
      img.src = src;
    }

    function buildPicturesGrid() {
      picturesGrid.innerHTML = '';

      /* first tile = blank: clears the outline layer (the only "clear" in the
         app, and it only touches the outline, never the child's strokes). */
      const blank = document.createElement('button');
      blank.className = 'picture-cell blank';
      blank.setAttribute('aria-label', 'blank page');
      blank.addEventListener('click', () => {
        clearLayer(actx, artCanvas);
        applyToolStyle();
        picturesPopup.hidden = true;
      });
      picturesGrid.appendChild(blank);

      /* then up to PICTURES_SHOWN random pictures (shuffled each open) */
      const pool = availableArt.slice();
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      pool.slice(0, CONFIG.PICTURES_SHOWN).forEach(file => {
        const cell = document.createElement('button');
        cell.className = 'picture-cell';
        const img = document.createElement('img');
        img.src = 'art/' + file;
        cell.appendChild(img);
        cell.addEventListener('click', () => {
          loadPicture('art/' + file);
          picturesPopup.hidden = true;
        });
        picturesGrid.appendChild(cell);
      });
    }

    document.getElementById('btn-pictures').addEventListener('click', () => {
      buildPicturesGrid();
      picturesPopup.hidden = false;
    });
    picturesPopup.addEventListener('click', e => {
      if (e.target === picturesPopup) picturesPopup.hidden = true;   // backdrop tap
    });

    /* =========================================================
       STEP 9 — Pages (10), each remembers both layers for the session
       ========================================================= */
    const pages = Array.from({ length: CONFIG.PAGE_COUNT }, () => ({ art: null, draw: null }));
    let curPage = 0;

    const arrowLeft  = document.getElementById('arrow-left');
    const arrowRight = document.getElementById('arrow-right');

    function snapshotCurrentPage() {
      pages[curPage].art  = snapshot(artCanvas);
      pages[curPage].draw = snapshot(drawCanvas);
    }
    function restorePage(i) {
      clearLayer(actx, artCanvas);
      clearLayer(dctx, drawCanvas);
      if (pages[i].art)  blit(pages[i].art,  actx, artCanvas);
      if (pages[i].draw) blit(pages[i].draw, dctx, drawCanvas);
      applyToolStyle();
    }
    function updateArrows() {
      arrowLeft.classList.toggle('disabled',  curPage === 0);
      arrowRight.classList.toggle('disabled', curPage === CONFIG.PAGE_COUNT - 1);
    }
    function goToPage(i) {
      if (i < 0 || i >= CONFIG.PAGE_COUNT || i === curPage) return;
      snapshotCurrentPage();
      curPage = i;
      restorePage(curPage);
      undoStack = [];          // undo is per-page + short-term (spec §11)
      updateUndoButton();
      updateArrows();
    }
    arrowLeft.addEventListener('click',  () => goToPage(curPage - 1));
    arrowRight.addEventListener('click', () => goToPage(curPage + 1));

    /* =========================================================
       STEP 10 — Undo (last 3 strokes on the current page)
       ========================================================= */
    let undoStack = [];
    const undoBtn = document.getElementById('btn-undo');

    function pushUndo() {
      undoStack.push(snapshot(drawCanvas));
      if (undoStack.length > CONFIG.UNDO_DEPTH) undoStack.shift();  // keep last 3
      updateUndoButton();
    }
    function undo() {
      if (!undoStack.length) return;
      blit(undoStack.pop(), dctx, drawCanvas);
      applyToolStyle();
      updateUndoButton();
    }
    function updateUndoButton() {
      undoBtn.classList.toggle('dim', undoStack.length === 0);
    }
    undoBtn.addEventListener('click', undo);

    /* Ask the browser to go fullscreen (hides Chrome's address bar/tabs).
       Must happen inside a real user tap — the Start button click. */
    function requestFullscreen() {
      const root = document.documentElement;
      const fn = root.requestFullscreen || root.webkitRequestFullscreen;
      if (!fn) return;                       // desktop browsers may lack it — fine
      try {
        const maybePromise = fn.call(root);
        if (maybePromise && maybePromise.catch) maybePromise.catch(() => {});
      } catch (e) { /* ignore — app still works in normal view */ }
    }

    function enterApp() {
      requestFullscreen();
      startScreen.style.display = 'none';    // hide the cover
      appEl.classList.remove('hidden');      // reveal toolbar + canvas
      /* Size after the layout settles. Fullscreen changes the viewport
         height, so we also size again on the fullscreenchange/resize
         events below — this first call covers browsers that don't fire
         a resize. */
      resizeCanvases();
      requestAnimationFrame(resizeCanvases);
      updateArrows();          // left arrow dimmed on page 1
      updateUndoButton();      // undo dimmed until the first stroke
    }

    /* Use 'click' so a finger tap (or a mouse, for desktop testing) works.
       'once' guarantees this only ever runs for the very first tap. */
    startBtn.addEventListener('click', enterApp, { once: true });

    /* Re-size whenever the viewport changes (entering/leaving fullscreen,
       rotation, address bar showing/hiding). Harmless until Step 3. */
    window.addEventListener('resize', resizeCanvases);
    document.addEventListener('fullscreenchange', resizeCanvases);
    document.addEventListener('webkitfullscreenchange', resizeCanvases);
  </script>
</body>
</html>
